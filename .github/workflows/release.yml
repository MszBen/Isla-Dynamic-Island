name: Release

# Pushing a tag like v0.1.0 builds Isla.exe and publishes it as a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:   # lets you test the build from the Actions tab (no release is created)

permissions:
  contents: write      # needed to create the release and upload the exe

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $ver = (Select-String -Path isla\__init__.py -Pattern '__version__ = "(.+)"').Matches.Groups[1].Value
          if ($tag -ne $ver) { throw "Tag v$tag does not match isla/__init__.py version $ver. Bump it and re-tag." }

      - name: Run tests
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt
          $env:QT_QPA_PLATFORM = "offscreen"
          python -m pytest -q

      - name: Build Isla.exe
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File packaging\build.ps1

      - name: Checksum
        shell: pwsh
        run: |
          $h = (Get-FileHash dist\Isla.exe -Algorithm SHA256).Hash.ToLower()
          "$h  Isla.exe" | Out-File -Encoding ascii dist\Isla.exe.sha256
          Get-Content dist\Isla.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: Isla-exe
          path: dist/Isla.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Isla.exe
            dist/Isla.exe.sha256
          generate_release_notes: true
          body: |
            ## Install
            1. Download **Isla.exe** below.
            2. Double-click it. No installation and no Python needed.

            Windows may show *"Windows protected your PC"* because the app isn't code-signed yet. Click **More info → Run anyway**.

            SHA-256 of `Isla.exe` is in `Isla.exe.sha256`.
