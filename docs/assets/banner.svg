<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 330" width="1280" height="330" role="img" aria-label="Isla, a dynamic island for Windows 11">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#120E26"/><stop offset="0.55" stop-color="#2E1A55"/><stop offset="1" stop-color="#5A2C52"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="shadow" x="-30%" y="-60%" width="160%" height="260%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.55"/></filter>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#D9CEFF"/></linearGradient>
  </defs>
  <style>
    text { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    .float { animation: float 5s ease-in-out infinite; transform-origin: 640px 68px; }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(5px); } }
    .pill { animation: breathe 6s ease-in-out infinite; transform-origin: 640px 68px; }
    @keyframes breathe { 0%,40%,100% { transform: scaleX(1); } 55%,85% { transform: scaleX(1.18); } }
    .eye { animation: blink 4.5s infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes blink { 0%,92%,100% { transform: scaleY(1); } 95% { transform: scaleY(0.1); } }
    .bar { transform-box: fill-box; transform-origin: bottom; animation: eq 0.9s ease-in-out infinite; }
    .bar:nth-of-type(2) { animation-delay: .2s; } .bar:nth-of-type(3) { animation-delay: .45s; }
    @keyframes eq { 0%,100% { transform: scaleY(.35); } 50% { transform: scaleY(1); } }
    .c { opacity: 0; animation-name: fall; animation-timing-function: cubic-bezier(.2,.6,.5,1); animation-iteration-count: infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes fall { 0% { opacity: 0; transform: translate(0,0) rotate(0); } 8% { opacity: 1; } 100% { opacity: 0; transform: translate(var(--dx), 230px) rotate(var(--rot)); } }
    .sub { animation: fade 1.2s ease-out both; }
    @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .c { opacity: 0 !important; } }
  </style>
  <rect width="1280" height="330" fill="url(#bg)"/>
  <g filter="url(#blur)" opacity="0.55">
